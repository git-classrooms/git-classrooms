# https://kubernetes.io/docs/concepts/services-networking/service/
apiVersion: v1
kind: Service
metadata:
  name: mailpit
spec:
  selector:
    app: mailpit
  type: ClusterIP
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit-smtp
spec:
  selector:
    app: mailpit
  type: ClusterIP
  ports:
  - name: smtp
    protocol: TCP
    port: 1025
    targetPort: smtp


