name: Build and push to package registry (Develop)
on:
  workflow_dispatch:
  push:
    paths:
      - "code_gen/**"
      - "config/**"
      - "controller/**"
      - "frontend/**"
      - "model/**"
      - "repository/**"
      - "router/**"
      - "utils/**"
      - "worker/**"
      - "wrapper/**"
      - "Dockerfile"
      - "go.mod"
      - "go.sum"
      - "main.go"
    branches:
      - develop

jobs:
  build_and_deploy_dev:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    outputs:
      COMMIT_SHA: ${{ steps.set_commit_sha.outputs.COMMIT_SHA }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set commit sha
        id: set_commit_sha
        run: |
          COMMIT_SHA=$(git rev-parse --short $GITHUB_SHA)
          echo "COMMIT_SHA=$COMMIT_SHA" >> $GITHUB_ENV
          echo "COMMIT_SHA=$COMMIT_SHA" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: set lower case owner name
        run: |
          echo "REPO_LC=${REPO,,}" >>${GITHUB_ENV}
        env:
          REPO: "${{ github.repository }}"

      - name: get build time
        run: |
          echo "BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >>${GITHUB_ENV}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            APP_VERSION=development
            APP_GIT_COMMIT=${{env.COMMIT_SHA}}
            APP_GIT_BRANCH=develop
            APP_BUILD_TIME=${{env.BUILD_TIME}}
            APP_GIT_REPOSITORY=${{github.repository}}
          file: ./Dockerfile
          platforms: linux/amd64 #,linux/arm64
          push: true
          tags: ghcr.io/${{ env.REPO_LC }}:dev, ghcr.io/${{ env.REPO_LC }}:${{ env.COMMIT_SHA }}

  commit_k8s_stage_image:
    runs-on: ubuntu-latest
    needs:
      build_and_deploy_dev
    env:
      COMMIT_SHA: ${{ needs.build_and_deploy_dev.outputs.COMMIT_SHA }}
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.COMMIT_PAT }}

      - name: Initialize mandatory git config
        run: |
          git config user.name "GitHub Actions"
          git config user.email noreply@github.com

      - name: Bump k8s stage image tag
        run: |
          cd ./deploy/kustomize/stage
          kustomize edit set image app-image=ghcr.io/${{ github.repository }}:${{ env.COMMIT_SHA }}

      - name: Commit changes
        run: |
          git add deploy/kustomize/stage/kustomization.yaml
          git commit -m "chore: update stage image tag [skip ci]" && git push origin develop || echo "No changes to commit"

